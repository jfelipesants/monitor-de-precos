<!doctype html>
<!-- Fixture reduzida, baseada na estrutura pública de uma página de produto do Mercado Livre.
     Sem JSON-LD e sem meta de preço: força o uso dos seletores (reais + centavos). -->
<html lang="pt-BR">
  <head>
    <title>Fone Bluetooth | Mercado Livre</title>
  </head>
  <body>
    <h1 class="ui-pdp-title">Fone De Ouvido Bluetooth JBL Tune 520BT Preto</h1>
    <div class="ui-pdp-price">
      <s class="andes-money-amount ui-pdp-price__part andes-money-amount--previous">
        <span class="andes-money-amount__currency-symbol">R$</span>
        <span class="andes-money-amount__fraction">1.599</span>
      </s>
      <div class="ui-pdp-price__second-line">
        <span class="andes-money-amount ui-pdp-price__part">
          <span class="andes-money-amount__currency-symbol">R$</span>
          <span class="andes-money-amount__fraction">1.249</span>
          <span class="andes-money-amount__cents">90</span>
        </span>
      </div>
    </div>
  </body>
</html>
