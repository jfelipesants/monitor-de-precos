<!doctype html>
<!-- Fixture reduzida, baseada na estrutura REAL da Kabum (nov/2026):
     site em Next.js, sem as classes antigas finalPrice/oldPrice.
     - JSON-LD informa só o preço à vista;
     - o preço "de" (riscado) está no __NEXT_DATA__ e num <span class="line-through">. -->
<html lang="pt-BR">
  <head>
    <title>Console PlayStation 5 | KaBuM!</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "Console Sony PlayStation 5, SSD 825GB, Edição Digital",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "BRL",
          "price": 4277.07,
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <h1>Console Sony PlayStation 5, SSD 825GB, Edição Digital</h1>
    <div class="flex items-center">
      <span class="text-xs font-normal leading-normal text-gray-400 line-through">R$ 4.692,51</span>
    </div>
    <p class="flex flex-wrap gap-4 font-bold text-gray-900 items-center">
      <span class="text-2xl leading-tight">R$ 4.277,07</span>
    </p>
    <script id="__NEXT_DATA__" type="application/json">
      {
        "props": {
          "pageProps": {
            "product": {
              "code": 989702,
              "prices": { "oldPrice": 4692.51, "price": 4599, "priceWithDiscount": 4277.07 }
            }
          }
        }
      }
    </script>
  </body>
</html>
